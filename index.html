<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>提气</title>
<meta name="description" content="提气：按住，等光环满一圈，再松开。一个关于收与放的三十口小游戏。">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root {
    /* Layout: editorial instruction column beside a quiet circular instrument. */
    --bg: #edf1ec;
    --surface: #f8faf5;
    --surface-2: #eef3ea;
    --ink: #18352c;
    --ink-soft: #2b4a3f;
    --muted: #596d63;
    --line: rgba(24, 53, 44, 0.16);
    --line-soft: rgba(24, 53, 44, 0.09);
    --accent: #e45e40;
    --accent-strong: #b9432a;
    --on-accent: #fff8f3;
    --mint: #6fa58e;
    --mint-deep: #2d6251;
    --mint-soft: #d7e4dc;
    --core-hi: #2b5748;
    --core: #16362b;
    --on-core: #f4f9f2;
    --core-ring: rgba(244, 249, 242, 0.14);
    --core-invite: rgba(244, 249, 242, 0.28);
    --petal-base: #285a49;
    --petal-mid: rgba(108, 160, 139, 0.72);
    --petal-tip: rgba(167, 200, 185, 0.08);
    --petal-inner: rgba(228, 94, 64, 0.32);
    --petal-line: rgba(250, 253, 248, 0.16);
    --petal-shadow: rgba(29, 64, 52, 0.12);
    --glow: rgba(228, 94, 64, 0.22);
    --glow-soft: rgba(94, 153, 130, 0.22);
    --wash-warm: rgba(228, 94, 64, 0.06);
    --wash-cool: rgba(112, 166, 144, 0.16);
    --dot: rgba(24, 53, 44, 0.12);
    --pill-bg: rgba(24, 53, 44, 0.035);
    --surface-shadow: 0 36px 80px -44px rgba(16, 43, 35, 0.38);
    --font-display: "ZCOOL XiaoWei", "Noto Serif SC", "Songti SC", serif;
    --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "Space Grotesk", "SFMono-Regular", Consolas, monospace;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1712;
      --surface: #12241d;
      --surface-2: #172c24;
      --ink: #e9f2eb;
      --ink-soft: #cfe0d6;
      --muted: #8fa59a;
      --line: rgba(233, 242, 235, 0.16);
      --line-soft: rgba(233, 242, 235, 0.08);
      --accent: #ff8a66;
      --accent-strong: #ffad93;
      --on-accent: #26130c;
      --mint: #86c8b1;
      --mint-deep: #3a806b;
      --mint-soft: #1d3b30;
      --core-hi: #ffffff;
      --core: #eaf4ec;
      --on-core: #14271f;
      --core-ring: rgba(20, 39, 31, 0.16);
      --core-invite: rgba(20, 39, 31, 0.26);
      --petal-base: #2f735f;
      --petal-mid: rgba(108, 188, 160, 0.64);
      --petal-tip: rgba(154, 221, 197, 0.08);
      --petal-inner: rgba(255, 138, 102, 0.26);
      --petal-line: rgba(235, 250, 242, 0.12);
      --petal-shadow: rgba(0, 0, 0, 0.28);
      --glow: rgba(255, 138, 102, 0.26);
      --glow-soft: rgba(112, 187, 160, 0.18);
      --wash-warm: rgba(255, 138, 102, 0.06);
      --wash-cool: rgba(74, 148, 122, 0.12);
      --dot: rgba(233, 242, 235, 0.12);
      --pill-bg: rgba(233, 242, 235, 0.04);
      --surface-shadow: 0 42px 90px -46px rgba(0, 0, 0, 0.9);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0b1712;
    --surface: #12241d;
    --surface-2: #172c24;
    --ink: #e9f2eb;
    --ink-soft: #cfe0d6;
    --muted: #8fa59a;
    --line: rgba(233, 242, 235, 0.16);
    --line-soft: rgba(233, 242, 235, 0.08);
    --accent: #ff8a66;
    --accent-strong: #ffad93;
    --on-accent: #26130c;
    --mint: #86c8b1;
    --mint-deep: #3a806b;
    --mint-soft: #1d3b30;
    --core-hi: #ffffff;
    --core: #eaf4ec;
    --on-core: #14271f;
    --core-ring: rgba(20, 39, 31, 0.16);
    --core-invite: rgba(20, 39, 31, 0.26);
    --petal-base: #2f735f;
    --petal-mid: rgba(108, 188, 160, 0.64);
    --petal-tip: rgba(154, 221, 197, 0.08);
    --petal-inner: rgba(255, 138, 102, 0.26);
    --petal-line: rgba(235, 250, 242, 0.12);
    --petal-shadow: rgba(0, 0, 0, 0.28);
    --glow: rgba(255, 138, 102, 0.26);
    --glow-soft: rgba(112, 187, 160, 0.18);
    --wash-warm: rgba(255, 138, 102, 0.06);
    --wash-cool: rgba(74, 148, 122, 0.12);
    --dot: rgba(233, 242, 235, 0.12);
    --pill-bg: rgba(233, 242, 235, 0.04);
    --surface-shadow: 0 42px 90px -46px rgba(0, 0, 0, 0.9);
    color-scheme: dark;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100%;
    overflow-x: hidden;
    background:
      radial-gradient(70% 58% at 86% 8%, var(--wash-cool), transparent 68%),
      radial-gradient(52% 44% at 4% 96%, var(--wash-warm), transparent 72%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button {
    font: inherit;
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  ::selection {
    background: var(--accent);
    color: var(--on-accent);
  }

  .sr-only {
    position: absolute !important;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .app {
    width: 100%;
    max-width: 1280px;
    min-height: 100%;
    margin: 0 auto;
    padding-block: clamp(16px, 2.6vw, 32px);
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 2.4vh, 28px);
  }

  /* Masthead */
  .topbar {
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .brand {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    position: relative;
    width: 38px;
    height: 38px;
    flex: none;
    border: 1px solid var(--line);
    border-radius: 50%;
    display: grid;
    place-items: center;
  }

  .brand-mark::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 6px var(--glow-soft);
  }

  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px solid var(--line-soft);
    border-radius: 50%;
  }

  .brand-copy {
    min-width: 0;
  }

  .brand-name {
    margin: 0;
    font-family: var(--font-display);
    font-size: 25px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.12em;
  }

  .brand-sub {
    margin: 5px 0 0;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 8px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.2em;
  }

  .top-meta {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 9px;
    flex: none;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .top-meta::before {
    content: "";
    width: 18px;
    height: 1px;
    background: var(--line);
  }

  /* Main split */
  .layout {
    min-width: 0;
    min-height: 0;
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr);
    gap: clamp(36px, 6vw, 92px);
    align-items: stretch;
  }

  .intro {
    min-width: 0;
    padding-block: clamp(14px, 3vh, 42px);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .eyebrow {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: 0.18em;
  }

  .eyebrow::before {
    content: "";
    width: 26px;
    height: 1px;
    flex: none;
    background: var(--accent);
  }

  .intro h1 {
    margin: 16px 0 0;
    color: var(--ink);
    font-family: var(--font-display);
    font-size: clamp(52px, 6vw, 90px);
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: 0.015em;
  }

  .h1-part {
    display: inline-block;
  }

  .h1-em {
    color: var(--accent);
  }

  .lead {
    max-width: 46ch;
    margin: 22px 0 0;
    color: var(--muted);
    font-size: clamp(14px, 1.15vw, 16px);
    line-height: 1.9;
  }

  .lead strong {
    color: var(--ink-soft);
    font-weight: 500;
  }

  .protocol {
    max-width: 430px;
    margin-top: clamp(24px, 4vh, 42px);
    border-top: 1px solid var(--line);
  }

  .step {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 14px;
    padding-block: 15px;
    border-bottom: 1px solid var(--line-soft);
  }

  .step-index {
    padding-top: 3px;
    color: var(--accent-strong);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.08em;
  }

  .step h2 {
    margin: 0;
    color: var(--ink);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.45;
    letter-spacing: 0.01em;
  }

  .step h2 span {
    margin-left: 7px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.16em;
  }

  .step p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.7;
  }

  .breath-note {
    margin: 20px 0 0;
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.65;
  }

  .breath-note::before {
    content: "";
    width: 6px;
    height: 6px;
    flex: none;
    border-radius: 50%;
    background: var(--mint);
  }

  /* Practice arena */
  .arena {
    position: relative;
    isolation: isolate;
    min-width: 0;
    overflow: hidden;
    padding: clamp(18px, 2.1vw, 28px);
    border: 1px solid var(--line);
    border-radius: 28px;
    background:
      radial-gradient(ellipse 52% 42% at 50% 54%, var(--glow-soft), transparent 72%),
      linear-gradient(165deg, var(--surface) 0%, var(--surface-2) 125%);
    box-shadow: var(--surface-shadow);
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.2vh, 16px);
  }

  .arena::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
    background-size: 18px 18px;
    opacity: 0.45;
    -webkit-mask-image: radial-gradient(ellipse 78% 68% at 50% 48%, #000 18%, transparent 78%);
    mask-image: radial-gradient(ellipse 78% 68% at 50% 48%, #000 18%, transparent 78%);
    pointer-events: none;
  }

  .arena > * {
    position: relative;
    z-index: 1;
  }

  .arena-head {
    min-width: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid var(--line-soft);
    border-radius: 999px;
    background: var(--pill-bg);
    color: var(--muted);
    font-size: 11px;
    line-height: 1;
    letter-spacing: 0.06em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s ease, border-color 0.3s ease;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    flex: none;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  .arena.is-active .status-pill {
    color: var(--accent-strong);
    border-color: var(--accent);
  }

  .arena.is-active .status-dot {
    background: var(--accent);
    animation: dotPulse 1.2s ease-in-out infinite;
  }

  .arena.is-release .status-pill {
    color: var(--ink-soft);
  }

  .arena.is-release .status-dot {
    background: var(--mint);
    box-shadow: 0 0 0 4px var(--glow-soft);
  }

  .score {
    position: relative;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    text-align: right;
  }

  .score-label {
    color: var(--muted);
    font-size: 10px;
    line-height: 1.4;
    letter-spacing: 0.12em;
    white-space: nowrap;
  }

  .score-line {
    display: flex;
    align-items: baseline;
    gap: 7px;
  }

  .score-num {
    display: inline-block;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: clamp(38px, 3.6vw, 52px);
    font-weight: 600;
    line-height: 0.85;
    letter-spacing: -0.045em;
    font-variant-numeric: tabular-nums;
    transform-origin: 100% 100%;
  }

  .score-unit {
    color: var(--muted);
    font-size: 11px;
    line-height: 1;
    letter-spacing: 0.1em;
  }

  .score.is-bumped .score-num {
    animation: countBump 520ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .plus-one {
    position: absolute;
    top: 16px;
    right: 0;
    z-index: 2;
    color: var(--accent-strong);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    pointer-events: none;
    animation: plusUp 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .dial {
    position: relative;
    flex: 1;
    min-height: clamp(310px, 40vh, 480px);
    display: grid;
    place-items: center;
  }

  .orbits {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(94%, 560px, 58vh);
    aspect-ratio: 1;
    z-index: 0;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: transform 900ms cubic-bezier(0.22, 1.2, 0.36, 1);
  }

  .arena.is-active .orbits {
    transform: translate(-50%, -50%) scale(0.96);
    transition-duration: 620ms;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }

  .orbit {
    position: absolute;
    border-radius: 50%;
  }

  .orbit-a {
    inset: 0;
    border: 1px dashed var(--line);
    opacity: 0.85;
    animation: orbitTurn 120s linear infinite;
  }

  .orbit-b {
    inset: 9%;
    border: 1px solid var(--line-soft);
    opacity: 0.9;
  }

  .orbit-c {
    inset: 18%;
    border: 1px dotted var(--line-soft);
    opacity: 0.75;
  }

  .satellite {
    position: absolute;
    top: -3px;
    left: 50%;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 5px var(--glow);
    transform: translateX(-50%);
  }

  .bloom-stage {
    position: relative;
    width: min(84%, 440px, 47vh);
    aspect-ratio: 1;
    z-index: 2;
  }

  .bloom {
    position: relative;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  .bloom:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 9px;
  }

  .bloom[aria-disabled="true"] {
    cursor: default;
  }

  .aura {
    position: absolute;
    inset: 5%;
    z-index: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 53%, var(--glow-soft) 0%, transparent 66%),
      radial-gradient(circle at 50% 50%, transparent 44%, var(--glow) 67%, transparent 76%);
    opacity: 0.78;
    transform: scale(0.97);
    pointer-events: none;
    transition: transform 950ms cubic-bezier(0.22, 1.2, 0.36, 1), opacity 700ms ease;
  }

  .arena.is-active .aura {
    opacity: 1;
    transform: scale(0.84);
    transition-duration: 620ms;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }

  .petals {
    position: absolute;
    inset: 2.5%;
    pointer-events: none;
  }

  .petals-outer {
    z-index: 1;
  }

  .petals-inner {
    inset: 15%;
    z-index: 2;
  }

  .petal {
    position: absolute;
    inset: 0;
    transform: rotate(var(--a));
  }

  .leaf {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16%;
    height: 46%;
    border-radius: 52% 52% 48% 48% / 64% 64% 38% 38%;
    background: linear-gradient(to top, var(--petal-base) 0%, var(--petal-mid) 58%, var(--petal-tip) 100%);
    box-shadow:
      inset 0 0 0 1px var(--petal-line),
      0 18px 30px -22px var(--petal-shadow);
    transform: translate(-50%, -100%) scaleY(1) scaleX(1);
    transform-origin: 50% 100%;
    transition:
      transform 840ms cubic-bezier(0.2, 1.28, 0.36, 1),
      filter 450ms ease,
      opacity 450ms ease;
  }

  .petals-outer .petal:nth-child(2n) .leaf {
    opacity: 0.78;
  }

  .petals-outer .petal:nth-child(3n) .leaf {
    height: 42%;
    opacity: 0.88;
  }

  .petals-outer .petal:nth-child(4n) .leaf {
    height: 50%;
  }

  .petals-inner .leaf {
    width: 14%;
    height: 35%;
    border-radius: 50% 50% 46% 46% / 62% 62% 40% 40%;
    background: linear-gradient(to top, var(--petal-inner) 0%, transparent 92%);
    box-shadow: none;
    opacity: 0.7;
    transition:
      transform 760ms cubic-bezier(0.2, 1.28, 0.36, 1),
      opacity 400ms ease;
  }

  .petals-inner .petal:nth-child(2n) .leaf {
    height: 29%;
    opacity: 0.48;
  }

  .arena.is-active .petals-outer .leaf {
    transform: translate(-50%, -100%) scaleY(0.56) scaleX(0.94);
    filter: brightness(1.08) saturate(1.06);
    transition-duration: 620ms;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }

  .arena.is-active .petals-inner .leaf {
    transform: translate(-50%, -100%) scaleY(0.44) scaleX(0.9);
    opacity: 0.9;
    transition-duration: 560ms;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }

  .core-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 72%;
    aspect-ratio: 1;
    z-index: 3;
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
    filter: blur(10px);
    opacity: 0.38;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.9);
    transition: transform 750ms cubic-bezier(0.22, 1.2, 0.36, 1), opacity 600ms ease;
  }

  .arena.is-active .core-glow {
    opacity: 0.95;
    transform: translate(-50%, -50%) scale(1.08);
    transition-duration: 600ms;
  }

  .core {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 36%;
    aspect-ratio: 1;
    z-index: 4;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--on-core);
    background: radial-gradient(circle at 36% 30%, var(--core-hi) 0%, var(--core) 72%);
    box-shadow:
      0 24px 48px -26px var(--petal-shadow),
      inset 0 0 0 1px var(--core-ring);
    transform: translate(-50%, -50%) scale(1);
    pointer-events: none;
    transition:
      transform 820ms cubic-bezier(0.2, 1.3, 0.36, 1),
      box-shadow 520ms ease;
  }

  .core::after {
    content: "";
    position: absolute;
    inset: -9%;
    border: 1px solid var(--core-invite);
    border-radius: 50%;
    opacity: 0.5;
    animation: invite 3.6s ease-in-out infinite;
    pointer-events: none;
  }

  .arena.is-active .core {
    transform: translate(-50%, -50%) scale(0.92);
    box-shadow:
      0 20px 46px -24px var(--petal-shadow),
      inset 0 0 0 1px var(--core-ring);
    transition-duration: 560ms;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  }

  .arena.is-active .core::after,
  .arena.is-release .core::after {
    animation: none;
    opacity: 0;
    transition: opacity 250ms ease;
  }

  .core-copy {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    pointer-events: none;
  }

  .core-action {
    font-family: var(--font-display);
    font-size: clamp(20px, 2.2vw, 27px);
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.12em;
    white-space: nowrap;
    transform: translateX(0.06em);
  }

  .core-hint {
    min-width: 6ch;
    color: var(--on-core);
    font-family: var(--font-mono);
    font-size: 8px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.16em;
    text-align: center;
    font-variant-numeric: tabular-nums;
    opacity: 0.62;
    text-transform: uppercase;
  }

  @media (hover: hover) and (pointer: fine) {
    .bloom:hover .leaf {
      filter: brightness(1.05);
    }

    .bloom:hover .aura {
      opacity: 0.95;
    }
  }

  .fx {
    position: absolute;
    inset: 0;
    z-index: 5;
    overflow: visible;
    pointer-events: none;
  }

  .burst-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 38%;
    aspect-ratio: 1;
    border: 1px solid var(--accent);
    border-radius: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.82);
    animation: ringOut 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .spark {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    margin: -2.5px 0 0 -2.5px;
    border-radius: 50%;
    opacity: 0;
    animation: sparkFly 900ms cubic-bezier(0.12, 0.72, 0.28, 1) forwards;
  }

  .arena-foot {
    min-height: 74px;
    padding-bottom: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 11px;
    text-align: center;
  }

  .feedback {
    max-width: 42ch;
    min-height: 1.6em;
    margin: 0;
    color: var(--ink-soft);
    font-size: clamp(13px, 1.15vw, 15px);
    line-height: 1.6;
    letter-spacing: 0.01em;
    transition: color 0.3s ease;
  }

  .arena.is-active .feedback {
    color: var(--ink);
  }

  .phases {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.08em;
  }

  .phase {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.3s ease;
    white-space: nowrap;
  }

  .phase-dot {
    width: 5px;
    height: 5px;
    flex: none;
    border-radius: 50%;
    opacity: 0.5;
    transition: opacity 0.3s ease, box-shadow 0.3s ease;
  }

  .phase-contract .phase-dot {
    background: var(--accent);
  }

  .phase-relax .phase-dot {
    background: var(--mint);
  }

  .phase-sep {
    width: 1px;
    height: 11px;
    background: var(--line-soft);
  }

  .arena.is-active .phase-contract {
    color: var(--accent-strong);
  }

  .arena.is-active .phase-contract .phase-dot {
    opacity: 1;
    box-shadow: 0 0 0 3px var(--glow);
  }

  .arena.is-release .phase-relax {
    color: var(--ink-soft);
  }

  .arena.is-release .phase-relax .phase-dot {
    opacity: 1;
  }

  /* Footer */
  .footer {
    min-width: 0;
    padding-top: clamp(12px, 1.8vh, 18px);
    border-top: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px 18px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
  }

  .footer p {
    max-width: 66ch;
    margin: 0;
  }

  .reset-btn {
    flex: none;
    appearance: none;
    -webkit-appearance: none;
    min-width: 104px;
    min-height: 34px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 11px;
    line-height: 1.2;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition:
      color 0.25s ease,
      border-color 0.25s ease,
      background 0.25s ease,
      opacity 0.25s ease;
  }

  .reset-btn:hover:not(:disabled) {
    color: var(--accent-strong);
    border-color: var(--accent);
  }

  .reset-btn.is-armed {
    color: var(--accent-strong);
    border-color: var(--accent);
    background: var(--glow);
  }

  .reset-btn:disabled {
    opacity: 0.36;
    cursor: default;
  }

  @keyframes dotPulse {
    0%,
    100% {
      box-shadow: 0 0 0 3px transparent;
    }
    50% {
      box-shadow: 0 0 0 5px var(--glow);
    }
  }

  @keyframes countBump {
    0% {
      transform: scale(1);
      color: var(--ink);
    }
    34% {
      transform: scale(1.12);
      color: var(--accent);
    }
    100% {
      transform: scale(1);
      color: var(--ink);
    }
  }

  @keyframes plusUp {
    0% {
      opacity: 0;
      transform: translateY(4px);
    }
    22% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translateY(-20px);
    }
  }

  @keyframes orbitTurn {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes invite {
    0%,
    100% {
      transform: scale(1);
      opacity: 0.34;
    }
    50% {
      transform: scale(1.045);
      opacity: 0.68;
    }
  }

  @keyframes ringOut {
    0% {
      opacity: 0.55;
      transform: translate(-50%, -50%) scale(0.82);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.7);
    }
  }

  @keyframes sparkFly {
    0% {
      opacity: 0;
      transform: rotate(var(--a)) translateY(0) scale(0.5);
    }
    18% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: rotate(var(--a)) translateY(calc(var(--d) * -1)) scale(0.12);
    }
  }

  @media (max-width: 1080px) {
    .layout {
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: clamp(28px, 4vw, 48px);
    }
  }

  @media (max-width: 900px) {
    .app {
      gap: 18px;
    }

    .layout {
      grid-template-columns: 1fr;
      gap: 22px;
    }

    .intro {
      max-width: 680px;
      padding-block: 6px 0;
    }

    .intro h1 {
      margin-top: 12px;
      font-size: clamp(42px, 8vw, 64px);
    }

    .lead {
      max-width: 52ch;
      margin-top: 14px;
      line-height: 1.8;
    }

    .protocol,
    .breath-note {
      display: none;
    }

    .arena {
      border-radius: 24px;
    }

    .dial {
      min-height: clamp(300px, 42vh, 430px);
    }

    .bloom-stage {
      width: min(76%, 380px, 44vh);
    }

    .orbits {
      width: min(90%, 480px, 54vh);
    }

    .footer {
      padding-top: 12px;
    }
  }

  @media (max-width: 560px) {
    .app {
      padding-block: 16px 20px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      gap: 16px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
    }

    .brand-name {
      font-size: 22px;
    }

    .brand-sub {
      font-size: 7.5px;
      letter-spacing: 0.16em;
    }

    .top-meta {
      font-size: 9px;
    }

    .intro h1 {
      margin-top: 10px;
      font-size: clamp(38px, 10.5vw, 48px);
      letter-spacing: 0;
    }

    .lead {
      margin-top: 12px;
      font-size: 13.5px;
      line-height: 1.8;
    }

    .arena {
      padding: 16px;
      border-radius: 22px;
    }

    .arena-head {
      align-items: center;
      gap: 10px;
    }

    .status-pill {
      padding: 7px 10px;
      font-size: 10px;
    }

    .score-label {
      font-size: 9px;
    }

    .score-num {
      font-size: 38px;
    }

    .dial {
      min-height: 290px;
    }

    .bloom-stage {
      width: min(86%, 330px, 42vh);
    }

    .orbits {
      width: min(98%, 390px, 52vh);
    }

    .core-action {
      font-size: clamp(19px, 5vw, 22px);
    }

    .arena-foot {
      min-height: 68px;
      gap: 8px;
    }

    .feedback {
      font-size: 12.5px;
    }

    .footer {
      gap: 10px 14px;
      font-size: 10.5px;
    }

    .footer p {
      max-width: 46ch;
    }

    .reset-btn {
      min-width: 92px;
      min-height: 38px;
      margin-left: auto;
      padding: 8px 12px;
    }
  }

  @media (max-width: 380px) {
    .top-meta::before {
      display: none;
    }

    .brand {
      gap: 9px;
    }

    .brand-sub {
      display: none;
    }

    .score-num {
      font-size: 34px;
    }

    .bloom-stage {
      width: min(90%, 300px, 40vh);
    }

    .orbits {
      width: min(100%, 350px, 50vh);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* Training, sound, rewards and guidance */
  :root {
    --gold: #a87621;
    --gold-strong: #7d520d;
    --gold-soft: rgba(168, 118, 33, 0.16);
    --backdrop: rgba(10, 26, 20, 0.5);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --gold: #f1c76c;
      --gold-strong: #ffdf9d;
      --gold-soft: rgba(241, 199, 108, 0.16);
      --backdrop: rgba(0, 0, 0, 0.72);
    }
  }

  :root[data-theme="dark"] {
    --gold: #f1c76c;
    --gold-strong: #ffdf9d;
    --gold-soft: rgba(241, 199, 108, 0.16);
    --backdrop: rgba(0, 0, 0, 0.72);
  }

  body.dialog-open {
    overflow: hidden;
  }

  .top-actions {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .sound-controls {
    flex: none;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .sound-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 34px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--pill-bg);
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.05em;
    white-space: nowrap;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease, opacity 0.25s ease;
  }

  .sound-state {
    margin-left: -2px;
    font-family: var(--font-mono);
    font-size: 8px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0;
    opacity: 0.62;
  }

  .sound-toggle[aria-pressed="true"] .sound-state {
    opacity: 1;
  }

  .sfx-icon {
    display: block;
    width: 13px;
    height: 13px;
    flex: none;
  }

  .sound-toggle:hover:not(:disabled) {
    color: var(--ink);
    border-color: var(--ink-soft);
  }

  .sound-toggle[aria-pressed="true"] {
    color: var(--accent-strong);
    border-color: var(--accent);
    background: var(--glow);
  }

  .sound-toggle:disabled {
    cursor: default;
    opacity: 0.45;
  }

  .sound-bars {
    height: 10px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
  }

  .sound-bars i {
    width: 2px;
    height: 8px;
    flex: none;
    border-radius: 2px;
    background: currentColor;
    transform: scaleY(0.32);
    transform-origin: bottom;
    transition: transform 0.25s ease;
  }

  .sound-toggle[aria-pressed="true"] .sound-bars i {
    transform: scaleY(0.62);
  }

  .sound-toggle.is-playing .sound-bars i {
    animation: soundBar 0.82s ease-in-out infinite alternate;
  }

  .sound-toggle.is-playing .sound-bars i:nth-child(2) {
    animation-delay: -0.22s;
  }

  .sound-toggle.is-playing .sound-bars i:nth-child(3) {
    animation-delay: -0.47s;
  }

  .safety-note {
    max-width: 42ch;
    margin: 14px 0 0;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.7;
  }

  .safety-mark {
    width: 6px;
    height: 6px;
    flex: none;
    margin-top: 0.56em;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.7;
  }

  .inline-link {
    appearance: none;
    -webkit-appearance: none;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--accent-strong);
    font: inherit;
    line-height: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  .score {
    gap: 4px;
  }

  .score-label {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 5px;
    font-variant-numeric: tabular-nums;
  }

  .score-target {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: 0.025em;
    white-space: nowrap;
    transition: color 0.25s ease;
  }

  .score.is-complete .score-target {
    color: var(--gold-strong);
  }

  .score.is-complete .score-num {
    color: var(--gold-strong);
  }

  .goal-meter {
    width: 78px;
    height: 3px;
    margin-top: 3px;
    display: flex;
    align-self: flex-end;
    gap: 3px;
  }

  .goal-seg {
    position: relative;
    flex: 1;
    overflow: hidden;
    border-radius: 999px;
    background: var(--line-soft);
  }

  .goal-seg i {
    display: block;
    width: var(--fill, 0%);
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
    transition: width 0.38s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.3s ease;
  }

  .score.is-complete .goal-seg i {
    background: var(--gold);
  }

  .arena.is-active .hold-meter,
  .arena.is-target .hold-meter,
  .arena.is-resting .hold-meter {
    opacity: 1;
  }

  .hold-meter {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 47%;
    aspect-ratio: 1;
    z-index: 4;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 0.28s ease;
  }

  .hold-meter svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    transform: rotate(-90deg);
  }

  .hold-track,
  .hold-fill {
    fill: none;
    stroke-width: 1.6;
  }

  .hold-track {
    stroke: var(--line);
    opacity: 0.55;
  }

  .hold-fill {
    stroke: var(--accent);
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
  }

  .arena.is-target .hold-fill {
    stroke: var(--gold);
  }

  .arena.is-resting .hold-fill {
    stroke: var(--mint);
  }

  .arena.is-target .status-pill {
    color: var(--gold-strong);
    border-color: var(--gold);
  }

  .arena.is-target .status-dot {
    background: var(--gold);
    box-shadow: 0 0 0 4px var(--gold-soft);
    animation: none;
  }

  .arena.is-resting .status-pill {
    color: var(--mint-deep);
    border-color: var(--mint);
  }

  .arena.is-resting .status-dot {
    background: var(--mint);
    box-shadow: 0 0 0 4px var(--glow-soft);
    animation: none;
  }

  .arena.is-complete:not(.is-active):not(.is-resting) .status-pill {
    color: var(--gold-strong);
    border-color: var(--gold);
  }

  .arena.is-complete:not(.is-active):not(.is-resting) .status-dot {
    background: var(--gold);
    box-shadow: 0 0 0 4px var(--gold-soft);
  }

  .arena.is-target .core-glow {
    background: radial-gradient(circle, var(--gold-soft) 0%, transparent 68%);
  }

  .arena.is-target .core {
    box-shadow:
      0 24px 48px -26px var(--petal-shadow),
      inset 0 0 0 1px var(--gold),
      0 0 0 1px var(--gold-soft);
  }

  .arena.is-active .core::after,
  .arena.is-target .core::after,
  .arena.is-resting .core::after,
  .arena.is-complete .core::after {
    animation: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .arena.is-target .phase-contract {
    color: var(--gold-strong);
  }

  .arena.is-target .phase-contract .phase-dot {
    background: var(--gold);
    opacity: 1;
    box-shadow: 0 0 0 3px var(--gold-soft);
  }

  .arena.is-resting .phase-relax {
    color: var(--mint-deep);
  }

  .arena.is-resting .phase-relax .phase-dot {
    opacity: 1;
    box-shadow: 0 0 0 3px var(--glow-soft);
  }

  .feedback {
    min-height: 2.9em;
    text-wrap: pretty;
  }

  .burst-ring.is-gold {
    border-color: var(--gold);
  }

  .reward-toast {
    position: fixed;
    top: max(18px, env(safe-area-inset-top, 0px));
    left: 50%;
    z-index: 60;
    width: max-content;
    max-width: min(390px, calc(100vw - 32px));
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 15px 10px 10px;
    border: 1px solid var(--gold);
    border-radius: 18px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--surface-shadow);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -12px);
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .reward-toast[hidden] {
    display: none !important;
  }

  .reward-toast.is-visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .reward-seal {
    width: 38px;
    height: 38px;
    flex: none;
    display: grid;
    place-items: center;
    border: 1px solid var(--gold);
    border-radius: 50%;
    background: var(--gold-soft);
    color: var(--gold-strong);
    font-family: var(--font-display);
    font-size: 19px;
    line-height: 1;
  }

  .reward-body {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .reward-body strong {
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.02em;
  }

  .reward-body span {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
  }

  .footer-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 8px;
  }

  .guide-btn {
    flex: none;
    appearance: none;
    -webkit-appearance: none;
    min-width: 104px;
    min-height: 34px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 11px;
    line-height: 1.2;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  .guide-btn:hover {
    color: var(--accent-strong);
    border-color: var(--accent);
  }

  .footer-actions .reset-btn {
    margin-left: 0;
  }

  .guide-dialog {
    width: min(700px, calc(100vw - 32px));
    max-height: min(86vh, 840px);
    max-height: min(86dvh, 840px);
    margin: auto;
    padding: 0;
    border: 1px solid var(--line);

<script>
(() => {
  "use strict";

  const STORE_KEY = "tiqi-kegel-v1";
  const MUSIC_KEY = "tiqi-kegel-music-v2";
  const SFX_KEY = "tiqi-kegel-sfx-v2";
  const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
  const HOLD_TARGET = 3;
  const DAILY_GOAL = 30;
  const MILESTONES = new Map([
    [10, { seal: "一", title: "十口 · 妙不可言", copy: "气顺了。", short: "十口达成。" }],
    [20, { seal: "二", title: "二十口 · 实力+1", copy: "是努力的轨迹，也是实力的证明。", short: "二十口达成。" }],
    [30, { seal: "满", title: "今日圆满", copy: "多多益善，但见好就收也是本事。", short: "今日圆满。" }]
  ]);

  const el = {
    arena: document.getElementById("arena"),
    bloom: document.getElementById("bloom"),
    actionText: document.getElementById("actionText"),
    actionHint: document.getElementById("actionHint"),
    holdFill: document.getElementById("holdFill"),
    statusText: document.getElementById("statusText"),
    feedback: document.getElementById("feedback"),
    count: document.getElementById("count"),
    scoreBox: document.getElementById("scoreBox"),
    scoreTarget: document.getElementById("scoreTarget"),
    resetBtn: document.getElementById("resetBtn"),
    fx: document.getElementById("fx"),
    todayLabel: document.getElementById("todayLabel"),
    moodText: document.getElementById("moodText"),
    progressOrbit: document.getElementById("progressOrbit"),
    musicToggle: document.getElementById("musicToggle"),
    musicState: document.getElementById("musicState"),
    sfxToggle: document.getElementById("sfxToggle"),
    sfxState: document.getElementById("sfxState"),
    rewardToast: document.getElementById("rewardToast"),
    rewardSeal: document.getElementById("rewardSeal"),
    rewardTitle: document.getElementById("rewardTitle"),
    rewardCopy: document.getElementById("rewardCopy")
  };

  const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

  let dailyKey = "";
  let count = 0;
  let booted = false;
  let pressing = false;
  let pressSource = null;
  let activePointer = null;
  let holdStartedAt = 0;
  let holdFrame = 0;
  let targetReached = false;
  let longHoldNoted = false;
  let resting = false;
  let restEndsAt = 0;
  let restDuration = 0;
  let restFrame = 0;
  let bumpTimer = 0;
  let resetTimer = 0;
  let resetArmed = false;
  let rewardHideTimer = 0;
  let rewardCleanupTimer = 0;
  let progressDots = [];
  let musicEnabled = true;
  let sfxEnabled = true;

  const sound = createSoundSystem();

  function localDateKey(date = new Date()) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function updateDateLabel() {
    const now = new Date();
    el.todayLabel.textContent = `${now.getMonth() + 1}月${now.getDate()}日 · 周${WEEKDAYS[now.getDay()]}`;
  }

  function validCount(value) {
    const number = Number(value);
    return Number.isFinite(number) && number >= 0 ? Math.floor(number) : null;
  }

  function readStoredCount() {
    try {
      const raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return 0;
      const data = JSON.parse(raw);
      if (!data || data.date !== dailyKey) return 0;
      return validCount(data.count) ?? 0;
    } catch (error) {
      return 0;
    }
  }

  function saveCount() {
    try {
      window.localStorage.setItem(
        STORE_KEY,
        JSON.stringify({ date: dailyKey, count })
      );
    } catch (error) {
      // Local persistence is a convenience; the exercise still works without it.
    }
  }

  function restoredCount(data) {
    if (!data || typeof data !== "object" || data.date !== dailyKey) return null;
    return validCount(data.count);
  }

  function readTogglePreference(key) {
    try {
      const stored = window.localStorage.getItem(key);
      return stored !== "off";
    } catch (error) {
      return true;
    }
  }

  function saveTogglePreference(key, enabled) {
    try {
      window.localStorage.setItem(key, enabled ? "on" : "off");
    } catch (error) {
      // Ignore storage failures.
    }
  }

  function createSoundSystem() {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return null;

    const padNotes = [73.416, 110, 146.832, 185];
    const melody = [
      293.66, 369.99, 440, 493.88, 440, 369.99, 329.63, 293.66,
      null, 440, 369.99, 329.63
    ];

    let ctx = null;
    let master = null;
    let compressor = null;
    let analyser = null;
    let musicBus = null;
    let sfxBus = null;
    let delayNode = null;
    let padNodes = [];
    let scheduler = 0;
    let nextNoteAt = 0;
    let noteIndex = 0;
    let musicOn = false;
    let sfxOn = false;
    let userStarted = false;
    let suspendTimer = 0;

    function init() {
      if (ctx) return true;

      try {
        ctx = new AudioCtor();

        master = ctx.createGain();
        master.gain.value = 0;

        compressor = ctx.createDynamicsCompressor();
        compressor.threshold.value = -16;
        compressor.knee.value = 16;
        compressor.ratio.value = 4;
        compressor.attack.value = 0.004;
        compressor.release.value = 0.24;

        analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;

        master.connect(compressor);
        compressor.connect(analyser);
        analyser.connect(ctx.destination);

        musicBus = ctx.createGain();
        musicBus.gain.value = 0;
        musicBus.connect(master);

        sfxBus = ctx.createGain();
        sfxBus.gain.value = 0.9;
        sfxBus.connect(master);

        delayNode = ctx.createDelay(1.4);
        delayNode.delayTime.value = 0.42;
        const feedback = ctx.createGain();
        feedback.gain.value = 0.22;
        const wet = ctx.createGain();
        wet.gain.value = 0.16;
        delayNode.connect(feedback);
        feedback.connect(delayNode);
        delayNode.connect(wet);
        wet.connect(musicBus);

        const padFilter = ctx.createBiquadFilter();
        padFilter.type = "lowpass";
        padFilter.frequency.value = 650;
        padFilter.Q.value = 0.2;
        const padGain = ctx.createGain();
        padGain.gain.value = 0.12;
        padFilter.connect(padGain);
        padGain.connect(musicBus);

        padNodes = padNotes.map((frequency, index) => {
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          oscillator.type = index === 0 ? "sine" : "triangle";
          oscillator.frequency.value = frequency;
          gain.gain.value = index === 0 ? 0.34 : 0.12;
          oscillator.connect(gain);
          gain.connect(padFilter);
          oscillator.start();
          return { oscillator, gain };
        });

        return true;
      } catch (error) {
        ctx = null;
        return false;
      }
    }

    function playMusicNote(frequency, when) {
      if (!ctx || !musicBus || !delayNode) return;

      const at = Math.max(when, ctx.currentTime);
      const oscillator = ctx.createOscillator();
      const shimmer = ctx.createOscillator();
      const shimmerGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      const send = ctx.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      shimmer.type = "sine";
      shimmer.frequency.value = frequency * 2.01;
      shimmerGain.gain.value = 0.1;
      filter.type = "lowpass";
      filter.frequency.value = 2200;
      send.gain.value = 0.24;

      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.16, at + 0.2);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 3.15);

      oscillator.connect(filter);
      shimmer.connect(shimmerGain);
      shimmerGain.connect(filter);
      filter.connect(gain);
      gain.connect(musicBus);
      gain.connect(send);
      send.connect(delayNode);

      oscillator.start(at);
      shimmer.start(at);
      oscillator.stop(at + 3.25);
      shimmer.stop(at + 3.25);

      oscillator.addEventListener("ended", () => {
        try {
          oscillator.disconnect();
          shimmer.disconnect();
          shimmerGain.disconnect();
          filter.disconnect();
          gain.disconnect();
          send.disconnect();
        } catch (error) {
          // Already disconnected.
        }
      }, { once: true });
    }

    function scheduleMusic() {
      if (!ctx || !musicOn || ctx.state !== "running") return;

      while (nextNoteAt < ctx.currentTime + 1.6) {
        const frequency = melody[noteIndex % melody.length];
        if (frequency) playMusicNote(frequency, nextNoteAt);
        noteIndex += 1;
        nextNoteAt += 2.7;
      }
    }

    function startMusicSchedule() {
      if (!ctx || !musicOn || ctx.state !== "running" || scheduler) return;
      nextNoteAt = ctx.currentTime + 0.25;
      scheduler = window.setInterval(scheduleMusic, 420);
      scheduleMusic();
    }

    function stopMusicSchedule() {
      if (scheduler) {
        window.clearInterval(scheduler);
        scheduler = 0;
      }
    }

    function unlock() {
      if (!init()) return false;

      userStarted = true;
      window.clearTimeout(suspendTimer);

      let resumePromise = null;
      try {
        resumePromise = ctx.resume();
        if (resumePromise && typeof resumePromise.catch === "function") {
          resumePromise.catch(() => {});
        }
      } catch (error) {
        // The next gesture can try again.
      }

      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setTargetAtTime(0.88, now, 0.2);
      musicBus.gain.cancelScheduledValues(now);
      musicBus.gain.setTargetAtTime(musicOn ? 0.55 : 0.0001, now, 0.22);

      if (musicOn) {
        if (ctx.state === "running") {
          startMusicSchedule();
        } else if (resumePromise && typeof resumePromise.then === "function") {
          resumePromise.then(() => {
            if (ctx && musicOn) startMusicSchedule();
          }).catch(() => {});
        }
      }

      return true;
    }

    function maybeSuspend() {
      if (!ctx || musicOn || sfxOn) return;

      stopMusicSchedule();
      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setTargetAtTime(0.0001, now, 0.06);
      window.clearTimeout(suspendTimer);
      suspendTimer = window.setTimeout(() => {
        if (!musicOn && !sfxOn && ctx && ctx.state === "running") {
          try {
            const result = ctx.suspend();
            if (result && typeof result.catch === "function") result.catch(() => {});
          } catch (error) {
            // Ignore audio lifecycle errors.
          }
        }
      }, 420);
    }

    function setMusic(on) {
      musicOn = on;

      if (on) {
        window.clearTimeout(suspendTimer);
        unlock();

        if (ctx) {
          const now = ctx.currentTime;
          musicBus.gain.cancelScheduledValues(now);
          musicBus.gain.setTargetAtTime(0.55, now, 0.22);
          if (ctx.state === "running") startMusicSchedule();
        }
      } else {
        stopMusicSchedule();
        if (ctx) {
          const now = ctx.currentTime;
          musicBus.gain.cancelScheduledValues(now);
          musicBus.gain.setTargetAtTime(0.0001, now, 0.1);
        }
        maybeSuspend();
      }
    }

    function setSfx(on) {
      sfxOn = on;
      if (on) {
        window.clearTimeout(suspendTimer);
        unlock();
      } else {
        maybeSuspend();
      }
    }

    function configure(music, sfx) {
      musicOn = music;
      sfxOn = sfx;
    }

    function suspend() {
      stopMusicSchedule();
      window.clearTimeout(suspendTimer);
      if (!ctx) return;

      try {
        const now = ctx.currentTime;
        master.gain.cancelScheduledValues(now);
        master.gain.setValueAtTime(0, now);
        if (ctx.state === "running") {
          const result = ctx.suspend();
          if (result && typeof result.catch === "function") result.catch(() => {});
        }
      } catch (error) {
        // Ignore audio lifecycle errors.
      }
    }

    function hasStarted() {
      return userStarted;
    }

    function isMusicPlaying() {
      return Boolean(ctx && musicOn && userStarted && ctx.state === "running");
    }

    function canPlaySfx() {
      return Boolean(ctx && sfxOn && ctx.state === "running");
    }

    function playSweep(fromFrequency, toFrequency, duration, peak, type) {
      if (!canPlaySfx()) return;

      const at = ctx.currentTime + 0.012;
      const oscillator = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();

      oscillator.type = type || "sine";
      oscillator.frequency.setValueAtTime(fromFrequency, at);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, toFrequency), at + duration * 0.85);
      filter.type = "lowpass";
      filter.frequency.value = 2200;
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(peak, at + 0.035);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);

      oscillator.connect(filter);
      filter.connect(gain);
      gain.connect(sfxBus);
      oscillator.start(at);
      oscillator.stop(at + duration + 0.05);

      oscillator.addEventListener("ended", () => {
        try {
          oscillator.disconnect();
          filter.disconnect();
          gain.disconnect();
        } catch (error) {
          // Already disconnected.
        }
      }, { once: true });
    }

    function playBell(frequency, delay, peak, duration) {
      if (!canPlaySfx()) return;

      const at = ctx.currentTime + 0.014 + delay;
      const oscillator = ctx.createOscillator();
      const shimmer = ctx.createOscillator();
      const shimmerGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      shimmer.type = "sine";
      shimmer.frequency.value = frequency * 2.01;
      shimmerGain.gain.value = 0.13;
      filter.type = "lowpass";
      filter.frequency.value = 3200;
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(peak, at + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);

      oscillator.connect(filter);
      shimmer.connect(shimmerGain);
      shimmerGain.connect(filter);
      filter.connect(gain);
      gain.connect(sfxBus);
      oscillator.start(at);
      shimmer.start(at);
      oscillator.stop(at + duration + 0.05);
      shimmer.stop(at + duration + 0.05);

      oscillator.addEventListener("ended", () => {
        try {
          oscillator.disconnect();
          shimmer.disconnect();
          shimmerGain.disconnect();
          filter.disconnect();
          gain.disconnect();
        } catch (error) {
          // Already disconnected.
        }
      }, { once: true });
    }

    function getLevel() {
      if (!analyser) return { rms: 0, peak: 0 };
      const data = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(data);
      let sum = 0;
      let peak = 0;
      for (let index = 0; index < data.length; index += 1) {
        const value = data[index];
        sum += value * value;
        if (Math.abs(value) > peak) peak = Math.abs(value);
      }
      return {
        rms: Math.sqrt(sum / data.length),
        peak
      };
    }

    function getDebug() {
      return {
        built: Boolean(ctx),
        contextState: ctx ? ctx.state : "none",
        userStarted,
        musicOn,
        sfxOn,
        schedulerActive: Boolean(scheduler),
        masterGain: master ? Number(master.gain.value.toFixed(4)) : 0,
        musicGain: musicBus ? Number(musicBus.gain.value.toFixed(4)) : 0,
        sfxGain: sfxBus ? Number(sfxBus.gain.value.toFixed(4)) : 0
      };
    }

    return {
      configure,
      unlock,
      suspend,
      setMusic,
      setSfx,
      hasStarted,
      isMusicPlaying,
      getLevel,
      getDebug,
      holdStart() {
        playSweep(196, 293.66, 0.8, 0.1, "sine");
      },
      target() {
        playBell(587.33, 0, 0.085, 1.2);
        playBell(880, 0.1, 0.065, 1);
      },
      release() {
        playSweep(440, 261.63, 0.95, 0.085, "sine");
      },
      invalid() {
        playSweep(196, 164.81, 0.3, 0.045, "sine");
      },
      restReady() {
        playBell(523.25, 0, 0.035, 0.7);
      },
      reward(level) {
        const notes = level >= 30
          ? [587.33, 739.99, 880, 1174.66]
          : level >= 20
            ? [587.33, 739.99, 880]
            : [587.33, 880];
        notes.forEach((frequency, index) => {
          playBell(frequency, 0.03 + index * 0.13, 0.085, 1.5 + index * 0.12);
        });
      },
      preview() {
        playBell(523.25, 0, 0.075, 0.9);
        playBell(659.25, 0.12, 0.06, 0.85);
      }
    };
  }

  function syncMusicIndicator() {
    const playing = Boolean(sound && musicEnabled && sound.isMusicPlaying());
    el.musicToggle.classList.toggle("is-playing", playing);
  }

  function updateSoundUI() {
    if (!sound) {
      el.musicToggle.disabled = true;
      el.sfxToggle.disabled = true;
      el.musicToggle.setAttribute("aria-pressed", "false");
      el.sfxToggle.setAttribute("aria-pressed", "false");
      el.musicToggle.setAttribute("aria-label", "此浏览器不支持背景音乐");
      el.sfxToggle.setAttribute("aria-label", "此浏览器不支持收放音效");
      el.musicState.textContent = "关";
      el.sfxState.textContent = "关";
      el.musicToggle.classList.remove("is-playing");
      return;
    }

    el.musicToggle.disabled = false;
    el.sfxToggle.disabled = false;
    el.musicToggle.setAttribute("aria-pressed", musicEnabled ? "true" : "false");
    el.sfxToggle.setAttribute("aria-pressed", sfxEnabled ? "true" : "false");
    el.musicToggle.setAttribute("aria-label", musicEnabled ? "关闭背景音乐" : "开启背景音乐");
    el.sfxToggle.setAttribute("aria-label", sfxEnabled ? "关闭收放音效" : "开启收放音效");
    el.musicState.textContent = musicEnabled ? "开" : "关";
    el.sfxState.textContent = sfxEnabled ? "开" : "关";

    if (musicEnabled) {
      syncMusicIndicator();
    } else {
      el.musicToggle.classList.remove("is-playing");
    }
  }

  function unlockSoundFromGesture(event) {
    if (!sound) return;
    if (!musicEnabled && !sfxEnabled) return;

    const target = event && event.target;
    if (target && typeof target.closest === "function" && target.closest(".sound-controls")) {
      return;
    }

    sound.configure(musicEnabled, sfxEnabled);
    sound.unlock();
    window.setTimeout(syncMusicIndicator, 160);
  }

  function toggleMusic() {
    if (!sound) return;

    const firstStart = musicEnabled && !sound.hasStarted();
    if (!firstStart) {
      musicEnabled = !musicEnabled;
      saveTogglePreference(MUSIC_KEY, musicEnabled);
    }

    sound.setMusic(musicEnabled);
    updateSoundUI();
    window.setTimeout(syncMusicIndicator, 160);
  }

  function toggleSfx() {
    if (!sound) return;

    const firstStart = sfxEnabled && !sound.hasStarted();
    if (!firstStart) {
      sfxEnabled = !sfxEnabled;
      saveTogglePreference(SFX_KEY, sfxEnabled);
    }

    sound.setSfx(sfxEnabled);
    if (sfxEnabled) {
      window.setTimeout(() => {
        sound.preview();
        syncMusicIndicator();
      }, 160);
    }
    updateSoundUI();
  }

  function setStatus(text) {
    el.statusText.textContent = text;
  }

  function setFeedback(text, animate = true) {
    if (el.feedback.textContent === text) return;
    el.feedback.textContent = text;

    if (
      animate &&
      !motionQuery.matches &&
      typeof el.feedback.animate === "function"
    ) {
      el.feedback.animate(
        [
          { opacity: 0.35, transform: "translateY(3px)" },
          { opacity: 1, transform: "translateY(0)" }
        ],
        { duration: 260, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" }
      );
    }
  }

  function setHoldProgress(percent) {
    const clamped = Math.max(0, Math.min(100, percent));
    el.holdFill.style.strokeDashoffset = String(100 - clamped);
  }

  function clearHoldUI() {
    el.arena.classList.remove("is-active", "is-target", "is-resting");
    el.bloom.setAttribute("aria-pressed", "false");
    el.bloom.setAttribute("aria-disabled", "false");
    el.bloom.setAttribute("aria-label", "按住蓄气，等光环满后松开");
    el.actionText.textContent = "按住";
    el.actionHint.textContent = "HOLD";
    setHoldProgress(0);
  }

  function syncResetButton() {
    el.resetBtn.disabled = count === 0;
    el.resetBtn.textContent = resetArmed ? "再点一次确认" : "清零今日";
    el.resetBtn.classList.toggle("is-armed", resetArmed);
    el.resetBtn.setAttribute(
      "aria-label",
      resetArmed ? "再点一次确认清零今日记录" : "清零今日记录"
    );
  }

  function showPlusOne() {
    if (motionQuery.matches) return;

    const plus = document.createElement("span");
    plus.className = "plus-one";
    plus.setAttribute("aria-hidden", "true");
    plus.textContent = "+1";
    el.scoreBox.appendChild(plus);

    const remove = () => plus.remove();
    plus.addEventListener("animationend", remove, { once: true });
    window.setTimeout(remove, 1100);
  }

  function buildProgressOrbit() {
    if (!el.progressOrbit || progressDots.length) return;

    const fragment = document.createDocumentFragment();
    for (let index = 0; index < DAILY_GOAL; index += 1) {
      const node = document.createElement("span");
      node.className = "progress-node";
      node.style.setProperty("--a", `${6 + index * 12}deg`);
      node.dataset.group = String(Math.floor(index / 10));
      fragment.appendChild(node);
      progressDots.push(node);
    }
    el.progressOrbit.appendChild(fragment);
  }

  function moodForCount(value) {
    if (value <= 0) return "今日 · 气还没聚";
    if (value < 10) return "今日 · 有点儿意思了";
    if (value < 20) return "今日 · 气顺了";
    if (value < 30) return "今日 · 气势来了";
    return "今日 · 圆满了";
  }

  function renderDaily(animate) {
    el.count.textContent = String(count);
    const complete = count >= DAILY_GOAL;
    const litCount = Math.min(count, DAILY_GOAL);

    el.scoreBox.classList.toggle("is-complete", complete);
    el.arena.classList.toggle("is-complete", complete);
    el.scoreTarget.textContent = complete ? "已圆满" : "/ 30";
    el.scoreBox.setAttribute(
      "aria-label",
      complete
        ? `今日气数 ${count} 口，目标 30 口，已圆满`
        : `今日气数 ${count} 口，目标 30 口`
    );

    progressDots.forEach((node, index) => {
      node.classList.toggle("is-lit", index < litCount);
    });

    if (el.moodText) {
      el.moodText.textContent = moodForCount(count);
    }

    syncResetButton();

    if (!animate || motionQuery.matches) return;

    el.scoreBox.classList.remove("is-bumped");
    void el.scoreBox.offsetWidth;
    el.scoreBox.classList.add("is-bumped");
    window.clearTimeout(bumpTimer);
    bumpTimer = window.setTimeout(() => {
      el.scoreBox.classList.remove("is-bumped");
    }, 560);

    showPlusOne();
  }

  function showReward(milestone) {
    if (!milestone) return;

    window.clearTimeout(rewardHideTimer);
    window.clearTimeout(rewardCleanupTimer);
    el.rewardSeal.textContent = milestone.seal;
    el.rewardTitle.textContent = milestone.title;
    el.rewardCopy.textContent = milestone.copy;
    el.rewardToast.hidden = false;
    el.rewardToast.classList.remove("is-visible");
    void el.rewardToast.offsetWidth;
    el.rewardToast.classList.add("is-visible");

    rewardHideTimer = window.setTimeout(() => {
      el.rewardToast.classList.remove("is-visible");
      rewardCleanupTimer = window.setTimeout(() => {
        el.rewardToast.hidden = true;
      }, 320);
    }, 4300);
  }

  function hideReward() {
    window.clearTimeout(rewardHideTimer);
    window.clearTimeout(rewardCleanupTimer);
    el.rewardToast.classList.remove("is-visible");
    el.rewardToast.hidden = true;
  }

  function disarmReset() {
    if (resetTimer) {
      window.clearTimeout(resetTimer);
      resetTimer = 0;
    }
    if (!resetArmed) {
      syncResetButton();
      return;
    }
    resetArmed = false;
    syncResetButton();
  }

  function rolloverIfNeeded() {
    const nextKey = localDateKey();
    if (nextKey === dailyKey) return false;

    dailyKey = nextKey;
    count = 0;
    resetArmed = false;
    if (resetTimer) {
      window.clearTimeout(resetTimer);
      resetTimer = 0;
    }
    updateDateLabel();
    hideReward();
    saveCount();
    renderDaily(false);
    return true;
  }

  function setIdle(initial = false) {
    if (pressing || resting) return;

    clearHoldUI();
    setStatus(count >= DAILY_GOAL ? "今日圆满" : count > 0 ? "再来一口" : "等你");

    let message;
    if (initial) {
      if (count >= DAILY_GOAL) {
        message = "今日圆满。想再来，就量力。";
      } else if (count > 0) {
        message = `今天攒了 ${count} 口。按住，继续。`;
      } else {
        message = "按住，让光环满一圈。";
      }
    } else {
      message = count >= DAILY_GOAL
        ? "今日圆满。想再来，就量力。"
        : "散完了，再来一口。";
    }

    setFeedback(message, !initial);
  }

  function startPress(source) {
    if (pressing) return;
    if (resting) {
      nudgeRest();
      return;
    }

    rolloverIfNeeded();
    disarmReset();

    if (sound && (musicEnabled || sfxEnabled)) {
      sound.unlock();
      window.setTimeout(syncMusicIndicator, 160);
      if (sfxEnabled) sound.holdStart();
    }

    pressing = true;
    pressSource = source;
    holdStartedAt = performance.now();
    targetReached = false;
    longHoldNoted = false;

    el.arena.classList.remove("is-resting", "is-target");
    el.arena.classList.add("is-active");
    el.bloom.setAttribute("aria-pressed", "true");
    el.bloom.setAttribute("aria-disabled", "false");
    el.bloom.setAttribute("aria-label", "正在聚气，保持到光环满");
    el.actionText.textContent = "聚";
    el.actionHint.textContent = "0.0s";
    setHoldProgress(0);
    setStatus("聚气中");
    setFeedback("让光聚起来。");

    window.cancelAnimationFrame(holdFrame);
    holdFrame = window.requestAnimationFrame(tickHold);
    vibrate(8);
  }

  function tickHold() {
    if (!pressing) return;

    const elapsed = Math.max(0, (performance.now() - holdStartedAt) / 1000);

    if (!targetReached) {
      el.actionHint.textContent = `${elapsed.toFixed(1)}s`;
      setHoldProgress(Math.min(1, elapsed / HOLD_TARGET) * 100);
    }

    if (!targetReached && elapsed >= HOLD_TARGET) {
      targetReached = true;
      el.arena.classList.add("is-target");
      el.actionText.textContent = "松手";
      el.actionHint.textContent = "满了";
      el.bloom.setAttribute("aria-label", "光环满了，可以松开");
      setStatus("满格");
      setFeedback("满了，松手。");
      setHoldProgress(100);
      if (sound) sound.target();
      vibrate(6);
    }

    if (!longHoldNoted && elapsed >= 10) {
      longHoldNoted = true;
      setFeedback("够久了，松手吧。");
    }

    holdFrame = window.requestAnimationFrame(tickHold);
  }

  function endPress(shouldCount) {
    if (!pressing) return;

    const heldSeconds = Math.max(0, (performance.now() - holdStartedAt) / 1000);
    const valid = heldSeconds >= HOLD_TARGET - 0.05;

    pressing = false;
    pressSource = null;
    activePointer = null;
    window.cancelAnimationFrame(holdFrame);
    holdFrame = 0;

    el.arena.classList.remove("is-active", "is-target");
    el.bloom.setAttribute("aria-pressed", "false");

    if (!shouldCount) {
      clearHoldUI();
      setStatus(count >= DAILY_GOAL ? "今日圆满" : count > 0 ? "再来一口" : "等你");
      setFeedback("这次不算。");
      return;
    }

    if (!valid) {
      clearHoldUI();
      setStatus("差一点");
      setFeedback("差一点，这次不算。再来。");
      if (sound) sound.invalid();
      vibrate(5);
      return;
    }

    rolloverIfNeeded();
    count += 1;
    saveCount();
    renderDaily(true);

    const milestone = MILESTONES.get(count) || null;
    const restSeconds = Math.min(10, Math.max(3, Math.round(heldSeconds)));

    if (sound) sound.release();
    beginRest(restSeconds, milestone);
    spawnBurst(Boolean(milestone));

    if (milestone) {
      showReward(milestone);
      if (sound) sound.reward(count);
      vibrate([12, 28, 12, 28, 18]);
    } else {
      vibrate(10);
    }
  }

  function beginRest(seconds, milestone) {
    resting = true;
    restDuration = seconds;
    restEndsAt = performance.now() + seconds * 1000;

    el.arena.classList.add("is-resting");
    el.bloom.setAttribute("aria-disabled", "true");
    el.bloom.setAttribute("aria-label", "散气中，稍后再来");
    el.actionText.textContent = "散";
    el.actionHint.textContent = `${seconds.toFixed(1)}s`;
    setStatus("散气中");
    setHoldProgress(100);

    if (milestone) {
      setFeedback(`${milestone.short}散一散。`);
    } else if (count >= DAILY_GOAL) {
      setFeedback("又一口。见好就收。");
    } else {
      setFeedback("漂亮，散一散。");
    }

    window.cancelAnimationFrame(restFrame);
    restFrame = window.requestAnimationFrame(tickRest);
  }

  function tickRest() {
    if (!resting) return;

    const remainingMs = Math.max(0, restEndsAt - performance.now());
    const remaining = remainingMs / 1000;
    el.actionHint.textContent = `${remaining.toFixed(1)}s`;
    setHoldProgress(restDuration > 0 ? (remaining / restDuration) * 100 : 0);

    if (remainingMs <= 20) {
      resting = false;
      restFrame = 0;
      window.cancelAnimationFrame(restFrame);
      if (sound) sound.restReady();
      setIdle(false);
      return;
    }

    restFrame = window.requestAnimationFrame(tickRest);
  }

  function nudgeRest() {
    if (!resting) return;
    setFeedback("先散完。");
    vibrate(5);
  }

  function cancelPress() {
    if (!pressing) return;

    pressing = false;
    pressSource = null;
    activePointer = null;
    window.cancelAnimationFrame(holdFrame);
    holdFrame = 0;

    clearHoldUI();
    setStatus(count >= DAILY_GOAL ? "今日圆满" : count > 0 ? "再来一口" : "等你");
    setFeedback("这次不算。");
  }

  function resetToday() {
    window.clearTimeout(resetTimer);
    resetTimer = 0;
    window.cancelAnimationFrame(holdFrame);
    holdFrame = 0;
    window.cancelAnimationFrame(restFrame);
    restFrame = 0;

    pressing = false;
    resting = false;
    pressSource = null;
    activePointer = null;
    resetArmed = false;

    clearHoldUI();
    hideReward();
    el.fx.replaceChildren();

    count = 0;
    saveCount();
    renderDaily(false);
    setStatus("等你");
    setFeedback("归零。再来一口？");
    vibrate(12);
  }

  function handleResetClick() {
    if (count === 0) return;

    if (!resetArmed) {
      resetArmed = true;
      syncResetButton();
      resetTimer = window.setTimeout(disarmReset, 4000);
      return;
    }

    resetToday();
  }

  function spawnBurst(celebration) {
    if (motionQuery.matches) return;

    const ring = document.createElement("span");
    ring.className = celebration ? "burst-ring is-gold" : "burst-ring";
    el.fx.appendChild(ring);
    ring.addEventListener("animationend", () => ring.remove(), { once: true });
    window.setTimeout(() => ring.remove(), 1400);

    const radius = el.bloom.getBoundingClientRect().width / 2 || 160;
    const total = celebration ? 24 : 13;
    const colors = celebration
      ? ["var(--gold)", "var(--gold)", "var(--accent)", "var(--mint)"]
      : ["var(--accent)", "var(--accent)", "var(--accent)", "var(--mint)"];

    for (let index = 0; index < total; index += 1) {
      const spark = document.createElement("i");
      const angle = (360 / total) * index + Math.random() * 16;
      const distance = radius * (0.64 + Math.random() * 0.5);
      spark.className = "spark";
      spark.style.setProperty("--a", `${angle}deg`);
      spark.style.setProperty("--d", `${distance}px`);
      spark.style.background = colors[index % colors.length];
      spark.style.animationDelay = `${Math.random() * 80}ms`;
      el.fx.appendChild(spark);
      spark.addEventListener("animationend", () => spark.remove(), { once: true });
      window.setTimeout(() => spark.remove(), 1600);
    }
  }

  function vibrate(pattern) {
    if (typeof navigator.vibrate !== "function") return;
    try {
      navigator.vibrate(pattern);
    } catch (error) {
      // Vibration is optional.
    }
  }

  function isHoldKey(event) {
    return event.key === " " || event.key === "Spacebar" || event.key === "Enter";
  }

  function handleReturn() {
    if (document.hidden) return;

    const dayChanged = rolloverIfNeeded();
    if (dayChanged && !pressing) {
      resting = false;
      window.cancelAnimationFrame(restFrame);
      restFrame = 0;
      clearHoldUI();
      setIdle(false);
      setFeedback("新的一天，从零开始。");
    }

    if (sound && sound.hasStarted() && (musicEnabled || sfxEnabled)) {
      sound.unlock();
      window.setTimeout(syncMusicIndicator, 160);
    }
  }

  function bindEvents() {
    el.bloom.addEventListener("pointerdown", (event) => {
      if (pressing) return;
      if (event.isPrimary === false) return;
      if (event.pointerType === "mouse" && event.button !== 0) return;
      if (resting) {
        nudgeRest();
        return;
      }

      activePointer = event.pointerId;
      startPress("pointer");

      try {
        el.bloom.setPointerCapture(event.pointerId);
      } catch (error) {
        // Pointer capture is helpful, but not required for a tap.
      }
    });

    el.bloom.addEventListener("pointerup", (event) => {
      if (
        pressSource !== "pointer" ||
        activePointer === null ||
        event.pointerId !== activePointer
      ) {
        return;
      }
      endPress(true);
    });

    el.bloom.addEventListener("pointercancel", (event) => {
      if (
        pressSource !== "pointer" ||
        activePointer === null ||
        event.pointerId !== activePointer
      ) {
        return;
      }
      endPress(false);
    });

    el.bloom.addEventListener("lostpointercapture", (event) => {
      if (
        pressing &&
        pressSource === "pointer" &&
        (activePointer === null || event.pointerId === activePointer)
      ) {
        endPress(false);
      }
    });

    el.bloom.addEventListener("keydown", (event) => {
      if (!isHoldKey(event) || event.repeat) return;
      event.preventDefault();
      if (resting) {
        nudgeRest();
        return;
      }
      startPress("keyboard");
    });

    el.bloom.addEventListener("keyup", (event) => {
      if (!isHoldKey(event)) return;
      if (pressSource !== "keyboard") return;
      event.preventDefault();
      endPress(true);
    });

    el.bloom.addEventListener("blur", () => {
      if (pressing && pressSource === "keyboard") cancelPress();
    });

    el.bloom.addEventListener("contextmenu", (event) => event.preventDefault());
    el.resetBtn.addEventListener("click", handleResetClick);

    el.musicToggle.addEventListener("click", toggleMusic);
    el.sfxToggle.addEventListener("click", toggleSfx);

    document.addEventListener("pointerdown", unlockSoundFromGesture, { capture: true });
    document.addEventListener("keydown", unlockSoundFromGesture, { capture: true });
    document.addEventListener("click", unlockSoundFromGesture, { capture: true });

    window.addEventListener("blur", () => {
      if (pressing) cancelPress();
    });

    window.addEventListener("focus", handleReturn);

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (pressing) cancelPress();
        if (resting) {
          window.cancelAnimationFrame(restFrame);
          restFrame = 0;
        }
        if (sound) sound.suspend();
        el.musicToggle.classList.remove("is-playing");
      } else {
        handleReturn();
        if (resting) {
          window.cancelAnimationFrame(restFrame);
          restFrame = window.requestAnimationFrame(tickRest);
        }
      }
    });
  }

  function boot(restored) {
    if (booted) {
      const nextCount = restoredCount(restored);
      if (nextCount !== null && nextCount !== count) {
        count = nextCount;
        renderDaily(false);
        if (!pressing && !resting) setIdle(false);
      }
      return;
    }

    booted = true;
    dailyKey = localDateKey();
    updateDateLabel();

    musicEnabled = sound ? readTogglePreference(MUSIC_KEY) : false;
    sfxEnabled = sound ? readTogglePreference(SFX_KEY) : false;
    if (sound) sound.configure(musicEnabled, sfxEnabled);
    updateSoundUI();

    const hotCount = restoredCount(restored);
    count = hotCount !== null ? hotCount : readStoredCount();
    if (hotCount !== null) saveCount();

    buildProgressOrbit();
    renderDaily(false);
    bindEvents();
    setIdle(true);

    if (sound && new URLSearchParams(window.location.search).has("debug-audio")) {
      window.__tiqiAudioDebug = {
        debug: () => ({ ...sound.getDebug(), musicEnabled, sfxEnabled }),
        level: () => sound.getLevel()
      };
    }
  }

  try {
    window.claude?.hot?.snapshot?.(() => ({ date: dailyKey, count }));
  } catch (error) {
    // The standalone page has no hot-update bridge.
  }

  if (window.claude?.hot?.ready) {
    window.claude.hot.ready(boot);
  } else {
    boot(window.claude?.hot?.data ?? {});
  }
})();
</script>
